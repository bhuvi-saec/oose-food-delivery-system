services:
  - type: web
    name: little-leaf-delivery
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: order-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ORDERS_FILE
        value: /var/data/orders.json
      - key: ADMIN_API_KEY
        generateValue: true
